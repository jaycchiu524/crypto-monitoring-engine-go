---
- name: Install and Configure ArgoCD for GitOps
  hosts: all
  become: true
  tasks:
    - name: Create argocd namespace
      command: /usr/local/bin/k3s kubectl create namespace argocd
      register: ns_create
      failed_when: 
        - ns_create.rc != 0 
        - "'already exists' not in ns_create.stderr"
      changed_when: "'created' in ns_create.stdout"

    - name: Install ArgoCD from stable manifests
      command: /usr/local/bin/k3s kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      changed_when: false # Standard install manifests are idempotent but noisy

    - name: Patch ArgoCD Server to use NodePort 30081
      shell: |
        /usr/local/bin/k3s kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "NodePort", "ports": [{"port": 80, "targetPort": 8080, "nodePort": 30081}]}}'
      register: patch_out
      failed_when: 
        - patch_out.rc != 0 
        - "'is invalid' in patch_out.stderr"
      changed_when: "'patched' in patch_out.stdout"

    - name: Wait for ArgoCD pods to be ready
      command: /usr/local/bin/k3s kubectl wait --for=condition=Ready pods --all -n argocd --timeout=300s
      changed_when: false

    - name: Retrieve ArgoCD Initial Admin Password
      shell: /usr/local/bin/k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false

    - name: Display ArgoCD Access Info
      debug:
        msg: 
          - "ArgoCD UI: http://{{ ansible_host }}:30081"
          - "Username: admin"
          - "Password: {{ argocd_password.stdout }}"
