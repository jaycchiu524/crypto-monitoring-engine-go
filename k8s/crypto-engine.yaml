---
# --- Fetcher Service ---
# The fetcher pod is responsible for connecting to Binance and publishing to Redis inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-fetcher
  template:
    metadata:
      labels:
        app: engine-fetcher
    spec:
      containers:
      - name: fetcher
        image: crypto-monitor:latest
        imagePullPolicy: Never # Critical: Tells K8s to use the manually imported image instead of pulling
        env:
        - name: APP_ROLE
          value: "fetcher"
        - name: SYMBOLS
          valueFrom:
            configMapKeyRef:
              name: crypto-config
              key: SYMBOLS
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: crypto-config
              key: REDIS_URL
---
# --- Processor Service ---
# The processor pod subscribes to Redis and exposes Prometheus metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-processor
  template:
    metadata:
      labels:
        app: engine-processor
    spec:
      containers:
      - name: processor
        image: crypto-monitor:latest
        imagePullPolicy: Never # Critical: K8s uses the image manually imported into the node
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: APP_ROLE
          value: "processor"
        - name: SYMBOLS
          valueFrom:
            configMapKeyRef:
              name: crypto-config
              key: SYMBOLS
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: crypto-config
              key: REDIS_URL
---
# --- Metrics Service ---
# Exposes the processor's metrics port outside the cluster (via NodePort 30080).
apiVersion: v1
kind: Service
metadata:
  name: engine-metrics
spec:
  type: NodePort
  selector:
    app: engine-processor
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080 # This allows your Mac's Prometheus to reach the metrics at 192.168.1.200:30080
