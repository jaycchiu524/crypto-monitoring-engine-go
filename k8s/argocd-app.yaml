---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-monitoring-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaycchiu524/crypto-monitoring-engine-go.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
