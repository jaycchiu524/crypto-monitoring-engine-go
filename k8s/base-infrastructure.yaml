---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crypto-config
data:
  # Comma-separated list of symbols to monitor
  SYMBOLS: "btcusdt,ethusdt,solusdt,bnbusdt,xrpusdt"
  # Internal Redis service name (used by both fetcher and processor)
  REDIS_URL: "redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
